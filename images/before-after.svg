<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#0D1117" fill-opacity="1"/><rect x="0" y="0" width="1080" height="10" rx="0" fill="#3FB950" fill-opacity="1"/><text x="72" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#3FB950" text-anchor="start" letter-spacing="3">SECOND-LIFE HARDWARE  ·  CHIP CRISIS 2026</text><text x="72" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" fill="#E6EDF3" text-anchor="start">Officially</text><text x="72" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" fill="#E6EDF3" text-anchor="start">unsupported.</text><text x="72" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" fill="#3FB950" text-anchor="start">Running anyway.</text><text x="72" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="400" fill="#8B949E" text-anchor="start">A 2018 office desktop, now running a CPU its maker never</text><text x="72" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="400" fill="#8B949E" text-anchor="start">approved for it.</text><rect x="72" y="560" width="936" height="180" rx="16" fill="#161B22" fill-opacity="1" stroke="#30363D" stroke-width="1.5"/><rect x="72" y="560" width="8" height="180" rx="0" fill="#F85149" fill-opacity="1"/><text x="114" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#F85149" text-anchor="start" letter-spacing="2">BEFORE</text><text x="114" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#E6EDF3" text-anchor="start">Intel Core i5-8500</text><text x="114" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#8B949E" text-anchor="start">●  6 cores</text><text x="414" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#8B949E" text-anchor="start">●  65 W</text><text x="714" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#F85149" text-anchor="start">●  overheating</text><text x="540.0" y="798" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#58A6FF" text-anchor="middle">+  add the microcode its final BIOS was missing</text><text x="540.0" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#8B949E" text-anchor="middle">(same-size swap · Boot Guard untouched · old CPU kept as fallback)</text><rect x="72" y="876" width="936" height="180" rx="16" fill="#161B22" fill-opacity="1" stroke="#238636" stroke-width="2"/><rect x="72" y="876" width="8" height="180" rx="0" fill="#3FB950" fill-opacity="1"/><text x="114" y="928" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#3FB950" text-anchor="start" letter-spacing="2">AFTER</text><text x="114" y="988" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#E6EDF3" text-anchor="start">Intel Core i7-9700T</text><text x="114" y="1032" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#8B949E" text-anchor="start">●  8 cores</text><text x="414" y="1032" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#8B949E" text-anchor="start">●  35 W</text><text x="714" y="1032" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#3FB950" text-anchor="start">●  cool &amp; stable</text><rect x="72" y="1126" width="936" height="172" rx="16" fill="#1C2129" fill-opacity="1" stroke="#30363D" stroke-width="1.5"/><text x="540.0" y="1184" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#E6EDF3" text-anchor="middle">Open source: replicate it on qualifying hardware</text><text x="540.0" y="1230" font-family="Consolas, monospace" font-size="28" font-weight="600" fill="#3FB950" text-anchor="middle">github.com/dmmdea/bios-microcode-cpu-enablement</text><text x="540.0" y="1272" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#8B949E" text-anchor="middle">Firmware work done remotely by an AI agent · jumper and chip moved by hand</text></svg>